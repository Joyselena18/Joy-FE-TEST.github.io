<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FE WEBDEV EPW 2025</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 min-h-screen relative overflow-hidden">

 
  <div class="flex flex-col justify-between h-screen">


    <div class="pt-12 flex justify-center">
    
      <div class="hidden md:grid grid-cols-3 gap-4">
        <div class="w-14 h-14 bg-orange-400 col-start-1 row-start-1"></div>
        <div class="w-14 h-14 bg-orange-400 col-start-2 row-start-1"></div>
        <div class="w-14 h-14 bg-orange-400 col-start-3 row-start-1"></div>
        <div class="w-14 h-14 bg-orange-400 col-start-2 row-start-2"></div>
        <div class="w-14 h-14 bg-orange-400 col-start-2 row-start-3"></div>
      </div>

      <div class="grid grid-cols-2 gap-4 md:hidden">
        <div class="w-14 h-14 bg-orange-400"></div>
        <div class="w-14 h-14 bg-orange-400"></div>
        <div class="w-14 h-14 bg-orange-400"></div>
        <div class="w-14 h-14 bg-orange-400"></div>
      </div>
    </div>

    
    <div class="relative w-full h-10 bg-green-600 flex justify-between items-center px-2">
      
      <div class="w-10 h-10 bg-blue-600 rounded-full"></div>

    
      <div class="w-24 h-24 bg-yellow-400 flex items-center justify-center">
        <div class="w-12 h-12 bg-blue-600 rounded-full"></div>
      </div>

    </div>
  </div>

</body>
</html>
